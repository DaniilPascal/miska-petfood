services:
  - type: web
    name: miska-petfood
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MISKA_DB_PATH
        value: /opt/render/project/src/backend/miska.db
      - key: MISKA_CORS_ORIGINS
        value: "*"
      - key: MISKA_DEMO_EMAIL
        value: demo@miska.shop
      - key: MISKA_DEMO_PASSWORD
        value: demo1234
      - key: MISKA_DEMO_NAME
        value: Demo User
      - key: MISKA_APP_VERSION
        value: "4.0.0"
